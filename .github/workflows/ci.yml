name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' build
      - run: python -m pytest -q tests/test_graph.py tests/test_ontology.py tests/test_viewer.py
      - run: python -c "import sys; import p2i_kg.app; assert 'torch' not in sys.modules"
      - run: python -m p2i_kg --database /tmp/atlas.sqlite3 validate --rdf
      - run: python -m build
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: PtwoI/p2i-core
          path: deps/core
      - uses: actions/checkout@v4
        with:
          repository: PtwoI/p2i-gui
          path: deps/gui
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ./deps/core -e ./deps/gui -e '.[runtime,language,test]'
      - run: python -m pytest -q
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/study_math.test.mjs
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: deps/gui/frontend
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: python tests/browser_runner.py
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          P2I_PLAYWRIGHT_MODULE: file://${{ github.workspace }}/deps/gui/frontend/node_modules/@playwright/test/index.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-proof
          path: artifacts/
